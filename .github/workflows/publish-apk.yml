name: Publish JACK X10 PRO APK

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: "Temporary download URL for the APK artifact ZIP"
        required: true
        type: string
      version_code:
        description: "Android versionCode"
        required: true
        default: "5"
        type: string
      version_name:
        description: "App versionName"
        required: true
        default: "1.4"
        type: string
      release_notes:
        description: "Release notes"
        required: false
        default: "بهبودها و رفع اشکالات."
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and extract APK
        env:
          INPUT_URL: ${{ inputs.artifact_url }}
        run: |
          curl --fail --location --retry 3 "$INPUT_URL" -o artifact.zip
          unzip -p artifact.zip app-debug.apk > JACK-X10-PRO.apk
          test -s JACK-X10-PRO.apk

      - name: Create update manifest
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          cat > update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "downloadUrl": "https://raw.githubusercontent.com/davood9818-nfs/JACK-X10-PRO-Releases/main/JACK-X10-PRO.apk",
            "releaseNotes": "$RELEASE_NOTES"
          }
          EOF

      - name: Publish files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JACK-X10-PRO.apk update.json
          git commit -m "Publish JACK X10 PRO release"
          git push
